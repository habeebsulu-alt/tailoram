<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- App Logo Gradient: from-brand-600 (#C25E00) to brand-400 (#E4985D) at 45 degrees -->
    <linearGradient id="appBrandGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C25E00" />
      <stop offset="100%" stop-color="#E4985D" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Rounded Badge Icon (Same geometry and gradient as App Navbar Logo) -->
  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#appBrandGradient)" filter="url(#softShadow)" />

  <!-- Centered White Scissors Icon rotated -45 degrees -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Scissor blades crossing through pivot (256, 256) -->
    <line x1="192" y1="120" x2="320" y2="392" />
    <line x1="320" y1="120" x2="192" y2="392" />
    <!-- Finger loop left -->
    <circle cx="172" cy="396" r="46" stroke="#ffffff" stroke-width="32" fill="none" />
    <!-- Finger loop right -->
    <circle cx="340" cy="396" r="46" stroke="#ffffff" stroke-width="32" fill="none" />
    <!-- Center pivot rivet -->
    <circle cx="256" cy="256" r="16" fill="#ffffff" stroke="none" />
  </g>
</svg>
