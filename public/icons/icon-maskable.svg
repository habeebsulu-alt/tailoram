<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background for Android Maskable Safe Zone -->
  <rect width="512" height="512" fill="url(#bgGradient)" />

  <!-- Center Badge scaled to fit 80% safe zone (circle of radius 205px) -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)">
    <!-- Gold Rounded Container -->
    <rect x="106" y="106" width="300" height="300" rx="76" fill="url(#goldGradient)" />
    
    <!-- Stylized Tailoram Scissors / Craft Icon -->
    <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="200" y1="140" x2="312" y2="372" />
      <line x1="312" y1="140" x2="200" y2="372" />
      <circle cx="180" cy="380" r="44" stroke="#ffffff" stroke-width="26" fill="none" />
      <circle cx="332" cy="380" r="44" stroke="#ffffff" stroke-width="26" fill="none" />
      <circle cx="256" cy="256" r="14" fill="#ffffff" stroke="none" />
    </g>
  </g>
</svg>
