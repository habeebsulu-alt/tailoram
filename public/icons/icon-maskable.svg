<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- App Logo Gradient: from-brand-600 (#C25E00) to brand-400 (#E4985D) at 45 degrees -->
    <linearGradient id="appBrandGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C25E00" />
      <stop offset="100%" stop-color="#E4985D" />
    </linearGradient>
  </defs>

  <!-- Full Bleed App Brand Gradient Background for Android Maskable Launcher Icons -->
  <rect width="512" height="512" fill="url(#appBrandGradient)" />

  <!-- Centered White Scissors Icon scaled to 80% safe zone -->
  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)">
    <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="192" y1="120" x2="320" y2="392" />
      <line x1="320" y1="120" x2="192" y2="392" />
      <circle cx="172" cy="396" r="46" stroke="#ffffff" stroke-width="36" fill="none" />
      <circle cx="340" cy="396" r="46" stroke="#ffffff" stroke-width="36" fill="none" />
      <circle cx="256" cy="256" r="18" fill="#ffffff" stroke="none" />
    </g>
  </g>
</svg>
